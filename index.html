		function Mob(id=0,rarity=1,other) {
			this.proto="Mob"

			this.name=MobNameList[this.id]
			this.attribute=structuredClone(MobAttributeList[this.name.slice(1)])
			if(typeof(other)==="number") other={maxhealth:other}
			Object.assign(this.attribute,other)
			if(this.attribute.hasOwnProperty("cost") && this.attribute.cost==="Default") {
				this.attribute.cost=NewValue.cost
			}
			if(this.attribute.hasOwnProperty("summon")) {
				if(isPercentage(this.attribute.summon)) this.attribute.summon=Math.max(betterFloor(getPercentage(this.attribute.summon)/100*this.attribute.maxhealth),1)
			}
			if(this.attribute.hasOwnProperty("heal")) {
				if(isPercentage(this.attribute.heal)) this.attribute.heal=betterFloor(getPercentage(this.attribute.heal)/100*this.attribute.maxhealth)

			}
			if(this.attribute.hasOwnProperty("reflect")) {
				if(isPercentage(this.attribute.reflect)) this.attribute.reflect=betterFloor(getPercentage(this.attribute.reflect)/100*this.attribute.damage)
			}
			if(this.attribute.hasOwnProperty("maxhealth") && !this.attribute.hasOwnProperty("health")) {
				this.attribute.health=this.attribute.maxhealth
			}
			if(this.action!=="None" && !this.attribute.hasOwnProperty("actionbar")) this.attribute.actionbar=0
			this.progressed=false
			this.effect=new Object()
		}

				}
			}

							let repeatFlag=false

						}

							if(!repeatFlag) vortexGroup.push({x:nearX,y:nearY})
						}

						affectUpdate++
					}
					for(let i of affectGroup) {

						for(let j of affectGroup) if(Math.abs(j.x-i.x)+Math.abs(j.y-i.y)===1) pathCount++
						if(pathCount!==2) affectValid=false

								find2=k

								if(find2>find1) find2--
								finalOrder.push(affectGroup.splice(find2,1)[0])
							}
						}
						while(affectGroup.length>0) {
							for(let i in affectGroup) if(Math.abs(affectGroup[i].x-finalOrder[finalOrder.length-1].x)+Math.abs(affectGroup[i].y-finalOrder[finalOrder.length-1].y)===1) {

								if(isMob(gridClone[i].content)) tempGrid=createGrid(79,0,0,"Mob_"+gridClone[i].content.name,1,gridClone[i].content.rarity)

							game.board[postSpin.x][postSpin.y]=gridClone[i].clone(postSpin.x,postSpin.y)
							game.board[postSpin.x][postSpin.y].print()
						}
						actionCheck=true
						dropFlag=true
					}
				}
				for(let i of vortexGroup) {
					let vortex=game.board[i.x][i.y].content
					vortex.attribute.state=(vortex.attribute.state+1)%vortex.attribute.period.length
					vortex.progressed=true
				}

		function repair(brokenObject) {
			if(!brokenObject.hasOwnProperty("proto")) return
			if(brokenObject.proto==="Petal") {
				Object.setPrototypeOf(brokenObject,Petal.prototype)
			}
			if(brokenObject.proto==="Mob") {
				Object.setPrototypeOf(brokenObject,Mob.prototype)
			}
			if(brokenObject.proto==="Item") {
				Object.setPrototypeOf(brokenObject,Item.prototype)
			}
			if(brokenObject.proto==="Grid") {
				Object.setPrototypeOf(brokenObject,Grid.prototype)
				if(typeof(brokenObject.content)==="object") repair(brokenObject.content)
			}
		}

			if(typeof(text)==="number" && text!==0) newGrid.innerHTML="<svg viewBox='0 0 100 100' class='in-svg'><path d='M50 10L90 50L50 90L10 50Z'/></svg><span class='mid'>"+text+"</span>"

		let gridSize
		let selectedGrid=new Object()
		selectedGrid.select=false
		let draggingGrid=new Object()
		draggingGrid.drag=false
		function getGrid(value,x,y) {
			return document.querySelector("[value='"+value+"'][data-x='"+x+"'][data-y='"+y+"']")
		}
		function mouseGridInfo() {
			let topLeft=getGrid(0,1,1).getBoundingClientRect()
			let mouseRow=betterFloor((mouseX-topLeft.left)/gridSize)+1,mouseColumn=betterFloor((mouseY-topLeft.top)/gridSize)+1
			if(mouseRow<1 || mouseRow>game.width || mouseColumn<1 || mouseColumn>game.height) {
				return
			}
			gridInfo(getGrid(0,mouseRow,mouseColumn))
		}
		function clickGrid(button) {
			if(animation) return
			if(!isVisible(document.getElementById("gridinfo")) && selectedGrid.select===false) return
			let buttonValue=parseInt(button.value),buttonX=parseInt(button.getAttribute("data-x")),buttonY=parseInt(button.getAttribute("data-y"))
			if(buttonValue===0) {
				if(selectedGrid.select===true && selectedGrid.value===0) {
					getGrid(0,selectedGrid.x,selectedGrid.y).style.opacity=1
					selectedGrid.select=false
					for(let i=1;i<=4;i++) if(selectedGrid.x+dx[i]===buttonX && selectedGrid.y+dy[i]===buttonY && validSwapCheck(selectedGrid.x,selectedGrid.y,i)) {
						exchange(selectedGrid.x,selectedGrid.y,i)
						return
					}
					gridInfo(button)
					return
				}
				closeGridInfo()
				selectedGrid.select=true
				selectedGrid.value=buttonValue
				selectedGrid.x=buttonX
				selectedGrid.y=buttonY
				button.style.opacity=0.5
			}
		}
		function dragGridStart(button) {
			if(animation) return
			if(!isVisible(document.getElementById("gridinfo"))) return
			if(selectedGrid.select===true) return
			let buttonValue=parseInt(button.value),buttonX=parseInt(button.getAttribute("data-x")),buttonY=parseInt(button.getAttribute("data-y"))
			if(buttonValue===0) {
				closeGridInfo()
				draggingGrid.drag=true
				draggingGrid.value=buttonValue
				draggingGrid.x=buttonX
				draggingGrid.y=buttonY
				document.addEventListener("mouseup",dragGridEnd)
			}
		}
		function dragGridEnd(mouseCord) {
			draggingGrid.drag=false
			document.removeEventListener("mouseup",dragGridEnd)
			let topLeft=getGrid(0,1,1).getBoundingClientRect()
			let mouseRow=betterFloor((mouseX-topLeft.left)/gridSize)+1,mouseColumn=betterFloor((mouseY-topLeft.top)/gridSize)+1
			if(mouseRow<1 || mouseRow>game.width || mouseColumn<1 || mouseColumn>game.height) {
				return
			}
			for(let i=1;i<=4;i++) if(draggingGrid.x+dx[i]===mouseRow && draggingGrid.y+dy[i]===mouseColumn && validSwapCheck(draggingGrid.x,draggingGrid.y,i)) {
				exchange(draggingGrid.x,draggingGrid.y,i)
				return
			}
			mouseGridInfo()
		}
		async function addTempMovingGrid(grid,startX,startY,endX,endY,period=200,opacity=[0.8,0.5],scale=0.5) {
			if(player.settings.skipanimation===true) return
			let startRect=getGrid(0,startX,startY).getBoundingClientRect()
			let endRect=getGrid(0,endX,endY).getBoundingClientRect()
			grid.style.position="absolute"
			grid.style.left=startRect.left+"px"
			grid.style.top=startRect.top+"px"
			grid.style.transform="translate(0px, 0px) scale(1)"
			grid.style.opacity=opacity[0]
			grid.style.transition="transform "+(0.9*period)+"ms linear, opacity "+(0.9*period)+"ms linear"
			document.body.appendChild(grid)
			await delay(period/10)
			grid.style.transform="translate("+(endRect.left-startRect.left)+"px, "+(endRect.top-startRect.top)+"px) scale("+scale+")"
			grid.style.opacity=opacity[1]
			setTimeout(()=>{grid.remove()},0.9*period)
		}
	</script>
	<script>
		const bookHTML=new Object()
		bookHTML["Advanced Crafter Guide"]="<h2>Advanced Crafter Guide</h2><span>Are you confused about these special entities? This is a guide for them!</span><br><span>As you see, to fight against endless mobs, limited petals would not be enough. There are spawners which create new petals constantly. They have a mark on the top of specified grid. The symbol is \"=x=\". You can view the level info (in bottom right corner, <span class='bold'>also used to leave a biome</span>) to know what will they spawn.</span><br><span>As you see again, for a board with more void grid, you need transporters to transport petal. They also have a mark on the top of specified grid, with a symbol of \"x,y\". This is the coordinate of grid where it transport petals from.</span><br><span>There are also walls which prevents you exchange petals. Petals crushed nearby will deal a static 1 damage to the wall. If both side of the wall are petals and crushed together, <span class='bold'>the damage stacks</span>.</span>"
		bookHTML["Flower Game Guide"]="<h2>Flower Game Guide</h2><div class='white-bg inner-box'><span style='color: #008000'>#include&lt;PFLFtools.h&gt;</span><span><span style='font-weight: bold'>using namespace</span> std<span style='color: #ff0000; font-weight: bold'>;</span></span><span><span style='font-weight: bold'>int</span> main<span style='color: #ff0000; font-weight: bold'>()</span></span><span style='color: #ff0000; font-weight: bold'>{</span><span style='margin-left: 2em'>system<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"cls\"</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>slowprint<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"↓MORE GAME (CLICK!)↓\"</span><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>slowprint<span style='color: #ff0000; font-weight: bold'>(</span><a href='https://6triple6single.github.io/Florroom' target='_blank' style='color: #0000ff; font-weight: bold; text-decoration: none'>\"FLORROOM\"</a><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>slowprint<span style='color: #ff0000; font-weight: bold'>(</span><a href='https://6triple6single.github.io/PFLF' target='_blank' style='color: #0000ff; font-weight: bold; text-decoration: none'>\"PFLF\"</a><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>slowprint<span style='color: #ff0000; font-weight: bold'>(</span><a href='https://6triple6single.github.io/Virus1' target='_blank' style='color: #0000ff; font-weight: bold; text-decoration: none'>\"VIRUS 1\"</a><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'><span style='font-weight: bold'>return</span> <span style='color: #800080'>0</span><span style='color: #ff0000; font-weight: bold'>;</span></span><span style='color: #ff0000; font-weight: bold'>}</span></div>"
		bookHTML["Petal Crafter Tutorial"]="<h2>Petal Crafter Tutorial</h2><span>You combined 3 petals into a line, then they crushed and crafted a new one! You have already seen how powerful it is. The Rock is instantly destroyed.</span><span>Maybe you will need to try something new. For example, crafting 4 or more petals, combining petals with different rarity... Anyway, this is a great starting, go on!</span><br><span>Oh, you are confused about how does damage work? Well, when you combine damaging petals together, all of them will do damage to a certain mob nearby (if exist). Then, each petal does damage to mobs around it. So actually <span class='bold'>you have dealt 30+10 damage to the Rock</span>! That's so powerful!</span><br><span>Oh, you also want to ask what is score? Score drops over turn. It determines how good your work is. Remember try to get as much score as you can.</span><br><span>Don't turn the [Resource] Log Display off in settings, you will be notified when you have new things to learn!</span>"
		bookHTML["Various Petal Collection"]="<h2>Various Petal Collection</h2><span>Craft a special petal with special type by your own!</span><br><span>The Row Type: It has an icon consisting of a horizontal line and two outward pointing arrows. It releases a blast when crushed. The blast will destroy all petals in the same row and also damage mobs.</span><span>The Column Type: It has an icon consisting of a vertical line and two outward pointing arrows. It also releases a blast when crushed. The blast affects things in the same column instead.</span><span>The Bomb Type: It has an icon with two diagonal lines and four outward pointing arrows on the corners. It also releases a blast when crushed. The blast affects things within <span class='bold'>sqrt(5)</span> distance instead.</span><span>The Kaleidoscope Type: It has a regular pentagon icon. When crushed, it collects petals of the same type instead of releasing blast. <span class='bold'>This will not destroy petals which destroys by blast</span>.</span><h3>How to get</h3><span>The Row Type: Combine 4 petals in a column. Only created if Bomb or Kaleidoscope type can't be created.</span><span>The Column Type: Combine 4 petals in a row. Same condition as above.</span><span>The Bomb Type: Creates whenever there is a cross (which means a petal is both crushed in row and column) but Kaleidoscope can not be created.</span><span>The Kaleidoscope Type: Combine 5 petals in a row or a column. Has the highest priority.</span><br><span>An area can only create one special type of petal. If there is only one rarity in an area, all petals will be combined into a higher rarity one, but it has the lowest priority. If there is no place to create, nothing will happen, AND this has nothing to do with energy loss.</span>"
		let bookHTMLTrans=structuredClone(bookHTML)
		function book(modify) {
			if(modify===-1 && player.bookreading>0) player.bookreading--
			if(modify===1 && player.bookreading<player.book.length-1) player.bookreading++

		let logDisplay=true,cleanerDegree=0
		function cleanerRotate(force=false) {
			if(cleanerDegree===0 && force===false) return

			document.getElementById("cleaner").style.transform="rotate("+cleanerDegree+"deg)"
		}
		function addLog(text,color="#000000") {
			if(text.startsWith("[Help]") && player.settings.closehelplog===true) return
			if(text.startsWith("[Command]") && player.settings.closecommandlog===true) return
			if(text.startsWith("[Chat]") && player.settings.closechatlog===true) return
			if(text.startsWith("[bot#7976]") && player.settings.closebotlog===true) return
			if(text.startsWith("[Petal]") && player.settings.closepetallog===true) return
			if(text.startsWith("[Mob]") && player.settings.closemoblog===true) return
			if(text.startsWith("[Flower]") && player.settings.closeflowerlog===true) return
			if(text.startsWith("[Determine]") && player.settings.closedeterminelog===true) return
			if(text.startsWith("[Resource]") && player.settings.closeresourcelog===true) return
			text=text.replace(/(?<=^\[).+?(?=\])/,(content)=>translateText(content))
			let logElement=document.createElement("div")

			if(cleanerDegree>0) return

			cleanerRotate(true)
		}

				logDisplay=false
				document.getElementById("log").style.display="none"
				document.getElementById("command-call").style.display="none"

				document.getElementById("expander").children[1].style.display=""
			}
		}
		function command(key) {
			if(key!=="Enter") return
			if(logDisplay===false) return
			let commandInput=document.getElementById("command-call").value
			document.getElementById("command-call").value=""
			if(commandInput.startsWith(".")) {
				commandInput=commandInput.slice(1)
				let validCommand=false
				if(commandInput==="help") {
					validCommand=true
					if(player.savesettings.language!=="Chinese") {
						addLog("[Help] Help: Print list of all available commands. (Format: .help)","#bf7fbf")
						addLog("[Help] PFLFstart: Play PFLF with bot#7976. (Format: .PFLFstart)","#bf7fbf")
						addLog("[Help] PFLFend: End PFLF game. (Format: .PFLFend)","#bf7fbf")
						addLog("[Help] Claim: Claim number in PFLF. (Format: .claim [number])","#bf7fbf")

						addLog("[Help] Help: 打印所有可用指令。 (格式: .help)","#bf7fbf")
						addLog("[Help] PFLFstart: 和机器人7976玩PFLF。 (格式: .PFLFstart)","#bf7fbf")
						addLog("[Help] PFLFend: 结束PFLF游戏。 (格式: .PFLFend)","#bf7fbf")
						addLog("[Help] Claim: 在PFLF中收取数字。 (格式: .claim [数字])","#bf7fbf")
						addLog("[Help] PFLFget: 打印PFLF状态。 (格式: .PFLFget)","#bf7fbf")
						addLog("[Help] PFLFhighscore: 打印PFLF高分记录。 (格式: .PFLFhighscore)","#bf7fbf")
					}
				}
				if(commandInput==="PFLFstart" && player.PFLF.active===false) {
					validCommand=true
					player.PFLF.active=true
					player.PFLF.turn=0
					player.PFLF.score=-1001
					player.PFLF.clear=-1
					player.PFLF.dice=0
					commandInput="claim 0"
					addLog("[bot#7976] "+translateText("PFLF started!"),"#7f7fff")
				}
				if(commandInput==="PFLFend" && player.PFLF.active===true) {
					validCommand=true
					player.PFLF.active=false
					addLog("[bot#7976] "+translateText("PFLF ended!"),"#7f7fff")
				}
				if(commandInput.startsWith("claim ") && player.PFLF.active===true) {
					let testValid=true,claimNum=commandInput.slice(6).match(/^\d+/)
					if(claimNum===null) testValid=false
					if(testValid===true) {
						claimNum=parseInt(claimNum)
						testValid=isPFLF(claimNum)

						let testStr1=player.PFLF.dice.toString(),testStr2=claimNum.toString()

						if(testStr2==="0") testStr2=""
						for(let i=0;i<testStr2.length;i++) {
							if(testStr1.indexOf(testStr2[i])===-1) {
								testValid=false
							} else {
								testStr1=testStr1.slice(0,testStr1.indexOf(testStr2[i]))+testStr1.slice(testStr1.indexOf(testStr2[i])+1)
							}
						}
						if(testValid===true) {
							player.PFLF.score+=(testStr2.length+1)**3
							if(testStr1==="") {
								player.PFLF.clear++
								player.PFLF.score+=1000
							}
							player.PFLF.dice=parseInt("0"+testStr1)
						}
					}
					if(testValid===true) {
						if(player.PFLF.dice>100000) {
							if(player.PFLF.score>player.PFLF.highscore) {

							player.PFLF.active=false
						}  else {

							for(let i=1;i<=3;i++) player.PFLF.dice=player.PFLF.dice*10+dice()

				}

		function encodeFile(savestr) {
			if(savestr.length%2>0) savestr+="79.76"
			let encodedstr=""
			for(let i=0;i<savestr.length/2;i++) {
				let encodeValue=(savestr[2*i].charCodeAt()-20)*130+(savestr[2*i+1].charCodeAt()-20)
				encodedstr+=String.fromCharCode(65+betterFloor(encodeValue/676))
				encodedstr+=String.fromCharCode(65+betterFloor(encodeValue/26)%26)
				encodedstr+=String.fromCharCode(65+encodeValue%26)
			}
			for(let i=0;i<encodedstr.length;i++) {
				encodedstr=encodedstr.slice(0,i)+String.fromCharCode(65+(encodedstr[i].charCodeAt()+65+betterFloor((i+1)/(encodedstr.length+1)*354233654)%26)%26)+encodedstr.slice(i+1)
			}
			return encodedstr
		}
		function decodeFile(encodedstr) {
			let savestr=""
			for(let i=0;i<encodedstr.length;i++) {
				encodedstr=encodedstr.slice(0,i)+String.fromCharCode(65+(encodedstr[i].charCodeAt()+65-betterFloor((i+1)/(encodedstr.length+1)*354233654)%26)%26)+encodedstr.slice(i+1)
			}
			for(let i=0;i<encodedstr.length/3;i++) {
				let encodeValue=(encodedstr[3*i].charCodeAt()-65)*676+(encodedstr[3*i+1].charCodeAt()-65)*26+(encodedstr[3*i+2].charCodeAt()-65)
				savestr+=String.fromCharCode(20+betterFloor(encodeValue/130))
				savestr+=String.fromCharCode(20+encodeValue%130)
			}
			if(savestr[savestr.length-1]==="6") savestr=savestr.slice(0,-5)
			return savestr
		}
		function importSave() {
			if(animation) return
			document.querySelectorAll("input[type='file']").forEach(input => input.remove())
			let fileInput=document.createElement("input")
			fileInput.type="file"
			fileInput.accept=".txt"
			fileInput.style.display="none"
			fileInput.addEventListener("change",function(e) {
				let savefile=e.target.files[0]
				if(!savefile) {
					document.body.removeChild(fileInput)
					return
				}
				let reader=new FileReader()
				reader.onload=async function(event) {
					try {
						savefile=JSON.parse(decodeFile(event.target.result))
						if(!savefile.player) throw new Error()
						clearAllInterval()
						player=savefile.player
						setPlayer()
						document.getElementById("end1").style["pointer-events"]="unset"
						for(let i=0;i<=10;i++) {
							document.getElementById("end1").style.opacity=i/10

					if(document.getElementById("help").style.display==="flex") document.getElementById("help").focus()
					pressed.target.blur()
				}
				return
			}
			if(letterArray.indexOf(pressed.key.toLowerCase())>=0) {
				tryInput(letterArray.indexOf(pressed.key.toLowerCase()))
				if(document.getElementById("help").style.display==="flex" && pressed.key===" ") pressed.preventDefault()
				return
			}
			if(pressed.key.startsWith("Arrow")) {
				if(pressed.key==="ArrowUp") tryInput(11)
				if(pressed.key==="ArrowRight") tryInput(12)
				if(pressed.key==="ArrowDown") tryInput(13)
				if(pressed.key==="ArrowLeft") tryInput(14)
				return
			}
			if(pressed.key==="Enter") {
				tryInput(79)
				return
			}
			if(pressed.key==="Backspace") {
				tryInput(81)
				return
			}

		let drag=false,dragX=0,dragY=0,worldcX=0,worldcY=0,scaleSize
		function setContainElement() {
			let containerStyle=window.getComputedStyle(document.getElementById("world-container"))
			scaleSize=Math.min(parseFloat(containerStyle.height),parseFloat(containerStyle.width))
			document.getElementById("world-container").addEventListener("mousedown",function(mouse) {
				if(mouse.target.id!=="blank") return
				closeMapInfo()
				drag=true
				dragX=mouseX
				dragY=mouseY
			} )
			document.addEventListener("mousemove",function(mouse) {
				if(drag!==true) return
				scaleSize=Math.min(parseFloat(containerStyle.height),parseFloat(containerStyle.width))
				worldcX+=(mouseX-dragX)*100/scaleSize,dragX=mouseX
				worldcY+=(mouseY-dragY)*100/scaleSize,dragY=mouseY
				document.getElementById("world-trans").style.transform="translate("+worldcX+"px, "+worldcY+"px)"
				updateHome()
			} )
			document.addEventListener("mouseup",function() {
				drag=false
			} )
		}
		function mapTranslate(dir) {
			worldcX+=10*dx[dir]
			worldcY+=10*dy[dir]
			document.getElementById("world-trans").style.transform="translate("+worldcX+"px, "+worldcY+"px)"
			updateHome()
		}
		function updateHome() {
			let scaledX=worldcX/parseFloat(window.getComputedStyle(document.getElementById("world-container")).width)
			let scaledY=worldcY/parseFloat(window.getComputedStyle(document.getElementById("world-container")).height)
			let scaleDistance=Math.max(Math.abs(scaledX),Math.abs(scaledY))
			if(Math.abs(scaledX)*scaleSize<50 && Math.abs(scaledY)*scaleSize<50) {
				document.getElementById("house").style.display="none"
			} else {
				document.getElementById("house").style.left=50+scaledX/scaleDistance*40+"%"
				document.getElementById("house").style.top=50+scaledY/scaleDistance*40+"%"
				document.getElementById("house").style.display="unset"
			}
		}

			worldcX=0

			document.getElementById("world-trans").style.transform=""
			updateHome()
		}

				player.biome=spotValue

		function printGameBoard() {
			document.getElementById("game-container").style["grid-template-columns"]="repeat("+game.width+", 1fr)"
			document.getElementById("game-container").style["grid-template-rows"]="repeat("+game.height+", 1fr)"
			document.getElementById("game-container").innerHTML=""
			for(let i=1;i<=game.height;i++) {
				for(let j=1;j<=game.width;j++) {
					document.getElementById("game-container").appendChild(createGrid(0,j,i,"Empty",1))
				}
			}
			for(let i=1;i<=game.width;i++) {
				for(let j=1;j<=game.height;j++) game.board[i][j].print()
			}
		}
		function startGame(chosenLevel) {
			selectedGrid.select=false
			draggingGrid.drag=false
			game.active=true
			game.saved=false
			game.level=chosenLevel
			game.width=levelList[player.biomename][game.level].width
			game.height=levelList[player.biomename][game.level].height
			game.turn=0
			game.score=6361
			updateValue()
			game.board=levelList[player.biomename][game.level].initialmap()
			game.wall=new Array()
			for(let i=1;i<=game.width;i++) {
				game.wall[i]=new Array()
				for(let j=1;j<=game.height;j++) game.wall[i][j]={1:0,2:0,3:0,4:0}
			}
			if(levelList[player.biomename][game.level].hasOwnProperty("wall")) {
				let wallCreate=levelList[player.biomename][game.level].wall
				for(let i=0;i<wallCreate.length;i++) {
					if(wallCreate[i].dir===2) {
						game.wall[wallCreate[i].x][wallCreate[i].y][2]=wallCreate[i].stack
						game.wall[wallCreate[i].x+1][wallCreate[i].y][4]=wallCreate[i].stack
					} else {
						game.wall[wallCreate[i].x][wallCreate[i].y][3]=wallCreate[i].stack
						game.wall[wallCreate[i].x][wallCreate[i].y+1][1]=wallCreate[i].stack
					}
				}
			}
			initialSpawn()
			setGame()
			game.flower=new Object()
			game.flower.maxhealth=NewValue.maxhealth
			if(!NewValue.hasOwnProperty("health")) {
				game.flower.health=game.flower.maxhealth
			} else {
				game.flower.health=NewValue.health
			}
			game.flower.effect=new Object()
			printGameBoard()
			displayGame()
			updateFlowerState()
			for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height;j++) game.board[i][j].wallprint()
		}
		function endGame(win) {
			if(animation) return
			if(win===true) {
				if(player.savesettings.language==="Chinese") {
					addLog("在"+game.turn+"回合内以"+game.score+"分完成了对"+translateText(player.biomename)+"关卡"+game.level+"的清理。")
				} else {
					addLog("Cleared "+player.biomename+" Level "+game.level+" in "+game.turn+" turn with "+game.score+" score.")
				}
				if(!player.explore[player.biomename].highscore.hasOwnProperty(game.level)) player.explore[player.biomename].highscore[game.level]=-1
				if(player.biomename==="Training Ground" && game.level===1 && player.explore[player.biomename].highscore[game.level]===-1) {
					player.dialog.startdialog=0
					setPlayer()
					dialog("Skip")
				}
				if(player.biomename==="Training Ground" && game.level===4 && player.explore[player.biomename].highscore[game.level]===-1) {
					player.dialog.petaltypedialog=0
					setPlayer()
					dialog("Skip")
				}
				if(player.biomename==="Training Ground" && game.level===7 && player.explore[player.biomename].highscore[game.level]===-1) {
					player.dialog.tutorialfinishdialog=0
					setPlayer()
					dialog("Skip")
				}
				if(game.score>player.explore[player.biomename].highscore[game.level]) player.explore[player.biomename].highscore[game.level]=game.score
			} else {
				if(player.savesettings.language==="Chinese") {
					addLog("已从"+translateText(player.biomename)+"关卡"+game.level+"撤离。")
				} else {
					addLog("Retreated from "+player.biomename+" Level "+game.level+".")
				}
			}
			game.active=false
			setGame()
			closeGridInfo()
			printBiome()
			displayWorld()
			document.getElementById("pause-btn").classList.add("llred-bg")
			updateFlowerState()
		}
		async function collapseGrid(grid) {
			if(player.settings.skipanimation===true) {
				if(parseInt(grid.getAttribute("value"))===0) {
					grid.replaceWith(createGrid(0,parseInt(grid.dataset.x),parseInt(grid.dataset.y),"Empty",1))
				}
				return
			}
			selectedGrid.select=false
			closeGridInfo(true)
			let saveAnimation=animation
			animation=true
			let gridValue=parseInt(grid.getAttribute("value")),gridX=parseInt(grid.dataset.x),gridY=parseInt(grid.dataset.y)
			for(let i=0;i<=20;i++) {
				grid.style.scale=1-i/20
				await delay(50)
			}
			await delay(200)
			if(gridValue===0) {
				grid.style.opacity=0
				grid.style.scale=1
				grid.replaceWith(createGrid(0,gridX,gridY,"Empty",1))
				for(let i=0;i<=5;i++) {
					grid.style.opacity=i/5
					await delay(20)
				}
			}
			animation=saveAnimation
		}
		function totalStar() {
			let answer=79
			for(let i in player.world) if(player.explore.hasOwnProperty(mapList[i].name)) {
				for(let j in player.explore[mapList[i].name].highscore) {
					if(player.explore[mapList[i].name].highscore[j]>=levelList[mapList[i].name][j].goal) {
						answer+=5
					} else {
						answer+=3
					}
				}
			}
			return answer
		}
		function remainingStar() {
			let answer=totalStar()
			for(let i in player.world) if(player.world[i].purchased===true) answer-=mapList[i].cost
			return answer
		}
		function checkAvailableWorld() {
			if(!player.world.hasOwnProperty(0)) player.world[0]=new Object()
			if(!player.world[0].hasOwnProperty("purchased")) player.world[0].purchased=false
			for(let i in mapList) if(!player.world.hasOwnProperty(i) && remainingStar()>=mapList[i].cost) {
				for(let j of mapList[i].precondition) if(player.world.hasOwnProperty(j) && player.world[j].purchased===true && !player.world.hasOwnProperty(i)) {
					player.world[i]=new Object()
					player.world[i].purchased=false
				}
			}
			setPlayer()
		}
		function checkAvailableBiome() {
			if(!player.explore.hasOwnProperty(player.biomename)) player.explore[player.biomename]=new Object()
			let exploreUpdate=player.explore[player.biomename]
			if(!exploreUpdate.hasOwnProperty("highscore")) exploreUpdate.highscore=new Object()
			if(!exploreUpdate.hasOwnProperty("available")) exploreUpdate.available=new Array()
			if(exploreUpdate.available.indexOf(1)===-1) exploreUpdate.available.push(1)
			for(let i in exploreUpdate.available) if(!levelList[player.biomename].hasOwnProperty(exploreUpdate.available[i])) {
				delete exploreUpdate.highscore[exploreUpdate.available[i]]
				exploreUpdate.available.splice(i,1)
			}
			for(let i in levelList[player.biomename]) if(exploreUpdate.available.indexOf(parseInt(i))===-1) {
				for(let j of levelList[player.biomename][i].precondition) if(exploreUpdate.highscore[j]>=0 && exploreUpdate.available.indexOf(parseInt(i))===-1) exploreUpdate.available.push(parseInt(i))
			}
			setPlayer()
		}
		function updateFlowerState() {
			if(game.active===true) {
				let barPercentage=game.flower.health/game.flower.maxhealth*100
				if(barPercentage>=12) {
					document.getElementById("bar-health").style.width=barPercentage+"%"
					document.getElementById("bar-health").style.opacity=1
				} else {
					document.getElementById("bar-health").style.width="12%"
					document.getElementById("bar-health").style.opacity=barPercentage/12
				}
				document.getElementById("flower-health").innerHTML=translateText("Health: ")+game.flower.health+"/"+game.flower.maxhealth
				document.getElementById("game-state").innerHTML="<span class='lmargin' style='color: "+mapList[player.biome].color+"'>"+translateText(player.biomename)+"</span><span class='blue lmargin'>"+translateText("Level ")+game.level+"</span><span id='score-tracker' class='dcyan lmargin'>"+translateText("Score: ")+game.score+"/"+levelList[player.biomename][game.level].goal+"</span>"
				if(game.score>=levelList[player.biomename][game.level].goal) {
					document.getElementById("score-tracker").classList.replace("dcyan","dgreen")
				}
				document.getElementById("flower-state-outside").style.display="none"
				document.getElementById("flower-state-inside").style.display="flex"
				if(game.flower.effect.hasOwnProperty("recover")) {
					if(getGrid(2,1,1)===null) {
						let effectElement=createGrid(2,1,1,"Recover",-2)
						effectElement.classList.add("llmargin")
						document.getElementById("flower-effect-buff").appendChild(effectElement)
					}
				} else {
					if(getGrid(2,1,1)!==null) getGrid(2,1,1).remove()
				}
				if(game.flower.effect.hasOwnProperty("poison")) {
					if(getGrid(2,1,2)===null) {
						let effectElement=createGrid(2,1,2,"Poison",-2)
						effectElement.classList.add("llmargin")
						document.getElementById("flower-effect-debuff").appendChild(effectElement)
					}
				} else {
					if(getGrid(2,1,2)!==null) getGrid(2,1,2).remove()
				}
			} else {
				if(!player.hasOwnProperty("biome")) {
					document.getElementById("game-state").innerHTML="<span class='blue'>"+translateText("You are on the planet: Azalea")+"</span>"
				} else {
					document.getElementById("game-state").innerHTML="<span class='dgreen'>"+translateText("You are in the biome: ")+"<span style='color: "+mapList[player.biome].color+"'>"+translateText(player.biomename)+"</span></span>"
				}
				document.getElementById("flower-state-inside").style.display="none"
				document.getElementById("flower-state-outside").style.display="flex"
				if(player.currencydisplay==="Remain") {
					document.getElementById("total-currency").style.display="none"
					document.getElementById("currency").style.display="unset"
				} else {
					document.getElementById("currency").style.display="none"
					document.getElementById("total-currency").style.display="unset"
				}
				document.getElementById("currency").innerHTML=translateText("Your currency")+": <span class='text2'>"+remainingStar()+"</span>★"
				document.getElementById("total-currency").innerHTML=translateText("Your total currency")+": <span class='text2'>"+totalStar()+"</span>★"
			}
		}
		function switchCurrency() {
			if(player.currencydisplay==="Remain") {
				player.currencydisplay="Total"
			} else {
				player.currencydisplay="Remain"
			}
			updateFlowerState()
		}
		function updateValue() {
			resetDefault()
			if(levelList[player.biomename][game.level].hasOwnProperty("valueset")) levelList[player.biomename][game.level].valueset()
		}
		function flowerInjure(mob) {
			if(game.flower.health===0) return
			if(mob.name==="!Missile (H)" || mob.name==="!Beetle" || mob.name==="!Crab" || mob.name==="!Starfish") {
				let pendingDamage=mob.attribute.damage
				if(pendingDamage>game.flower.health) pendingDamage=game.flower.health
				game.flower.health-=pendingDamage
				if(player.savesettings.language==="Chinese") {
					addLog("[Flower] 花朵受到了<span style='color: "+rarityColorEP[mob.rarity]+"'>"+translateText(mob.name)+"</span>造成的"+pendingDamage+"伤害，剩余"+game.flower.health+"生命值。","#00bfbf")
				} else {
					addLog("[Flower] Flower received "+pendingDamage+" damage from <span style='color: "+rarityColorEP[mob.rarity]+"'>"+mob.name+"</span>, "+game.flower.health+" health remaining.","#00bfbf")
				}
			}
			if(mob.name==="!Spider" || mob.name==="!Missile (S)") {
				let pendingDamage=mob.attribute.damage,effectTurn=mob.attribute.duration
				if(!game.flower.effect.hasOwnProperty("poison")) game.flower.effect.poison=new Array()
				for(let i=0;i<effectTurn;i++) {
					if(!game.flower.effect.poison.hasOwnProperty(i)) game.flower.effect.poison[i]=0
					game.flower.effect.poison[i]+=pendingDamage
				}
			}
			updateFlowerState()
		}
		function flowerHeal(petal) {
			if(game.flower.health===0) return

		function dropable(gridX,gridY,dir=0) {
			if(game.board[gridX][gridY].state!=="Existing") return false
			if(game.board[gridX][gridY].content.attribute.drop==="Disabled") return false
			if(gridX+dir<1 || gridX+dir>game.width || gridY+1>game.height) return false
			if(game.board[gridX+dir][gridY+1].state!=="Empty") return false
			if(levelList[player.biomename][game.level].hasOwnProperty("transportset")) for(let i=0;i<levelList[player.biomename][game.level].transportset.length;i++) {
				if(levelList[player.biomename][game.level].transportset[i].end.x===gridX+dir && levelList[player.biomename][game.level].transportset[i].end.y===gridY+1) return false
			}
			if(game.wall[gridX][gridY][3]>0) return false
			if(dir===1 && game.wall[gridX][gridY][2]>0) return false
			if(dir===-1 && game.wall[gridX][gridY][4]>0) return false
			return true
		}
		async function dropAll() {
			dropFlag=false
			dropTime=0
			if(levelList[player.biomename][game.level].hasOwnProperty("spawnset")) for(let i=0;i<levelList[player.biomename][game.level].spawnset.length;i++) if(game.board[levelList[player.biomename][game.level].spawnset[i].x][levelList[player.biomename][game.level].spawnset[i].y].state==="Empty") {
				game.board[levelList[player.biomename][game.level].spawnset[i].x][levelList[player.biomename][game.level].spawnset[i].y]=spawnPetal(levelList[player.biomename][game.level].spawnset[i].x,levelList[player.biomename][game.level].spawnset[i].y,levelList[player.biomename][game.level].spawnset[i].set)
				dropTime+=dropTimeIncrement
				game.board[levelList[player.biomename][game.level].spawnset[i].x][levelList[player.biomename][game.level].spawnset[i].y].print()
			}
			if(levelList[player.biomename][game.level].hasOwnProperty("transportset")) for(let i=0;i<levelList[player.biomename][game.level].transportset.length;i++) {
				let transportGrid=levelList[player.biomename][game.level].transportset[i]
				if(game.board[transportGrid.start.x][transportGrid.start.y].state==="Existing" && game.board[transportGrid.start.x][transportGrid.start.y].content.attribute.drop!=="Disabled" && game.board[transportGrid.end.x][transportGrid.end.y].state==="Empty") {
					dropFlag=true
					dropTime+=dropTimeIncrement
					game.board[transportGrid.end.x][transportGrid.end.y]=game.board[transportGrid.start.x][transportGrid.start.y].clone(transportGrid.end.x,transportGrid.end.y)
					game.board[transportGrid.end.x][transportGrid.end.y].print()
					game.board[transportGrid.start.x][transportGrid.start.y].empty()
					game.board[transportGrid.start.x][transportGrid.start.y].print()
				}
			}
			for(let i=1;i<=game.height;i++) for(let j=1;j<=game.width;j++) if(dropable(j,i)) game.board[j][i].drop()
			if(!dropFlag) {
				let sideDrop=new Array()
				for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height;j++) {
					if(dropable(i,j,1)) sideDrop.push({x:i,y:j,dir:1})
					if(dropable(i,j,-1)) sideDrop.push({x:i,y:j,dir:-1})
				}
				if(sideDrop.length>0) {
					let singleSideDrop=sideDrop[roll(0,sideDrop.length-1)]
					game.board[singleSideDrop.x][singleSideDrop.y].drop(singleSideDrop.dir)
				}
			}
			if(dropTime===0) dropTime=dropTimeIncrement
			if(dropTime>dropTimeLimit) dropTime=dropTimeLimit
			await delay(dropTime)
		}

		let mapClone,mapRearranged=false
		function crushFixCheck(crusher,fixer) {
			if(mapClone[crusher.x][crusher.y].state!=="Rearranging" || mapClone[fixer.x][fixer.y].state!=="Rearranging") return false
			let rowSame=new Object()
			for(let i=-2;i<=2;i++) if(crusher.x+i>=1 && crusher.x+i<=game.width && mapClone[crusher.x+i][crusher.y].state!=="Empty" && isPetal(mapClone[crusher.x+i][crusher.y].content) && mapClone[crusher.x+i][crusher.y].content.id===mapClone[fixer.x][fixer.y].content.id) rowSame[i]=true
			if(rowSame[-2]===true && rowSame[-1]===true) return false
			if(rowSame[-1]===true && rowSame[1]===true) return false
			if(rowSame[1]===true && rowSame[2]===true) return false
			let columnSame=new Object()
			for(let i=-2;i<=2;i++) if(crusher.y+i>=1 && crusher.y+i<=game.height && mapClone[crusher.x][crusher.y+i].state!=="Empty" && isPetal(mapClone[crusher.x][crusher.y+i].content) && mapClone[crusher.x][crusher.y+i].content.id===mapClone[fixer.x][fixer.y].content.id) columnSame[i]=true
			if(columnSame[-2]===true && columnSame[-1]===true) return false
			if(columnSame[-1]===true && columnSame[1]===true) return false
			if(columnSame[1]===true && columnSame[2]===true) return false
			rowSame=new Object()
			for(let i=-2;i<=2;i++) if(fixer.x+i>=1 && fixer.x+i<=game.width && mapClone[fixer.x+i][fixer.y].state!=="Empty" && isPetal(mapClone[fixer.x+i][fixer.y].content) && mapClone[fixer.x+i][fixer.y].content.id===mapClone[crusher.x][crusher.y].content.id) rowSame[i]=true
			if(rowSame[-2]===true && rowSame[-1]===true) return false
			if(rowSame[-1]===true && rowSame[1]===true) return false
			if(rowSame[1]===true && rowSame[2]===true) return false
			columnSame=new Object()
			for(let i=-2;i<=2;i++) if(fixer.y+i>=1 && fixer.y+i<=game.height && mapClone[fixer.x][fixer.y+i].state!=="Empty" && isPetal(mapClone[fixer.x][fixer.y+i].content) && mapClone[fixer.x][fixer.y+i].content.id===mapClone[crusher.x][crusher.y].content.id) columnSame[i]=true

		function adjustMap() {
			if(validMapCheck()) return true
			if(player.biomename==="Training Ground" && game.level<=4) return false
			let adjustList=new Array(),availablePetalNum=new Object(),availablePetal=new Array()
			mapClone=new Array()
			for(let i=1;i<=game.width;i++) {
				mapClone[i]=new Array()
				for(let j=1;j<=game.height;j++) mapClone[i][j]=game.board[i][j].clone()
			}
			for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height;j++) if(mapClone[i][j].state==="Existing" && isPetal(mapClone[i][j].content) && mapClone[i][j].type==="Normal" && mapClone[i][j].content.attribute.rearrange!=="None") {
				if(!availablePetalNum.hasOwnProperty(mapClone[i][j].content.id)) availablePetalNum[mapClone[i][j].content.id]=0
				availablePetalNum[mapClone[i][j].content.id]++
				mapClone[i][j].state="Rearranging"
				availablePetal.push(mapClone[i][j].clone())
			}
			for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height-2;j++) {
				if(mapClone[i][j].state==="Empty" || mapClone[i][j].content===undefined) continue

				if(mapClone[i][j+2].state==="Empty" || mapClone[i][j+2].content===undefined) continue

				if(mapClone[i][j+1].content.attribute.move==="Disabled") continue
				if(mapClone[i][j+2].content.attribute.move==="Disabled") continue
				for(let k in availablePetalNum) {

						if(swapPlace!==1 && mapClone[i+1][j].state!=="Rearranging" && isPetal(mapClone[i+1][j].content) && mapClone[i+1][j].content.id===kId) requiredAmount--
						if(swapPlace!==2 && mapClone[i+2][j].state!=="Rearranging" && isPetal(mapClone[i+2][j].content) && mapClone[i+2][j].content.id===kId) requiredAmount--
						if(mapClone[swapEnd.x][swapEnd.y].state!=="Rearranging" && isPetal(mapClone[swapEnd.x][swapEnd.y].content) && mapClone[swapEnd.x][swapEnd.y].content.id===kId) requiredAmount--
						if(requiredAmount>availablePetalNum[k]) continue
						let newAdjust=new Object()
						newAdjust.adjustId=kId
						newAdjust.adjustPetal=new Array()
						newAdjust.adjustPetal[1]={x:i,y:j}
						newAdjust.adjustPetal[2]={x:i+1,y:j}
						newAdjust.adjustPetal[3]={x:i+2,y:j}
						newAdjust.adjustPetal[swapPlace+1]=swapEnd
						adjustList.push(newAdjust)
					}
				}
			}
			while(adjustList.length>0) {
				let newAdjust=adjustList.splice(roll(0,adjustList.length-1),1)[0]
				let indexArray=new Array(),indexArrayMatch=new Array()
				for(let i=0;i<availablePetal.length;i++) {
					indexArray.push(i)
					if(availablePetal[i].content.id===newAdjust.adjustId) indexArrayMatch.push(i)
				}
				for(let i=1;i<=3;i++) if(mapClone[newAdjust.adjustPetal[i].x][newAdjust.adjustPetal[i].y].state==="Rearranging") {
					let matchRearrange=indexArrayMatch.splice(roll(0,indexArrayMatch.length-1),1)[0]
					indexArray.splice(indexArray.indexOf(matchRearrange),1)
					mapClone[newAdjust.adjustPetal[i].x][newAdjust.adjustPetal[i].y]=availablePetal[matchRearrange].clone(newAdjust.adjustPetal[i].x,newAdjust.adjustPetal[i].y)
					mapClone[newAdjust.adjustPetal[i].x][newAdjust.adjustPetal[i].y].state="Rearranged"
				}
				for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height;j++) if(mapClone[i][j].state==="Rearranging") {
					let normalRearrange=indexArray.splice(roll(0,indexArray.length-1),1)[0]
					mapClone[i][j]=availablePetal[normalRearrange].clone(i,j)
				}
				let crushArray=new Array(),fixFlag=true
				for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height-2;j++) if(isPetal(mapClone[i][j].content) && isPetal(mapClone[i][j+1].content) && isPetal(mapClone[i][j+2].content) && mapClone[i][j].content.id===mapClone[i][j+1].content.id && mapClone[i][j].content.id===mapClone[i][j+2].content.id) crushArray.push([{x:i,y:j},{x:i,y:j+1},{x:i,y:j+2}])
				for(let i=1;i<=game.width-2;i++) for(let j=1;j<=game.height;j++) if(isPetal(mapClone[i][j].content) && isPetal(mapClone[i+1][j].content) && isPetal(mapClone[i+2][j].content) && mapClone[i][j].content.id===mapClone[i+1][j].content.id && mapClone[i][j].content.id===mapClone[i+2][j].content.id) crushArray.push([{x:i,y:j},{x:i+1,y:j},{x:i+2,y:j}])
				while(crushArray.length>0 && fixFlag) {
					fixFlag=false
					let fixingCrush=crushArray.splice(roll(0,crushArray.length-1),1)[0]
					while(fixingCrush.length>0 && !fixFlag) {
						let specifiedFix=fixingCrush.splice(roll(0,fixingCrush.length-1),1)[0]
						let fixableArray=new Array()
						for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height;j++) if(crushFixCheck({x:specifiedFix.x,y:specifiedFix.y},{x:i,y:j})) fixableArray.push({x:i,y:j})
						if(fixableArray.length>0) {
							fixFlag=true
							let fixer=fixableArray[roll(0,fixableArray.length-1)]
							let tempGrid=mapClone[fixer.x][fixer.y].clone()
							mapClone[fixer.x][fixer.y]=mapClone[specifiedFix.x][specifiedFix.y].clone(fixer.x,fixer.y)
							mapClone[specifiedFix.x][specifiedFix.y]=tempGrid.clone(specifiedFix.x,specifiedFix.y)
						}
					}
					crushArray=new Array()
					for(let i=1;i<=game.width;i++) for(let j=1;j<=game.height-2;j++) if(isPetal(mapClone[i][j].content) && isPetal(mapClone[i][j+1].content) && isPetal(mapClone[i][j+2].content) && mapClone[i][j].content.id===mapClone[i][j+1].content.id && mapClone[i][j].content.id===mapClone[i][j+2].content.id) crushArray.push([{x:i,y:j},{x:i,y:j+1},{x:i,y:j+2}])
					for(let i=1;i<=game.width-2;i++) for(let j=1;j<=game.height;j++) if(isPetal(mapClone[i][j].content) && isPetal(mapClone[i+1][j].content) && isPetal(mapClone[i+2][j].content) && mapClone[i][j].content.id===mapClone[i+1][j].content.id && mapClone[i][j].content.id===mapClone[i+2][j].content.id) crushArray.push([{x:i,y:j},{x:i+1,y:j},{x:i+2,y:j}])
				}
				for(let i=1;i<=3;i++) if(mapClone[newAdjust.adjustPetal[i].x][newAdjust.adjustPetal[i].y].state==="Rearranged") {
					mapClone[newAdjust.adjustPetal[i].x][newAdjust.adjustPetal[i].y].state="Rearranging"
				}
				if(fixFlag===true) {
					mapRearranged=true
					return true
				}
			}
			return false
		}
